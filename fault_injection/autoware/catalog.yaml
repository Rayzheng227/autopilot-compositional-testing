schema_version: 1
faults:
  - id: FI-PLAN-008
    status: validated_causal_ego_fault
    module: Planning
    package: motion_velocity_smoother
    source_file: planning/motion_velocity_smoother/src/motion_velocity_smoother_node.cpp
    function: MotionVelocitySmootherNode::calcTrajectoryVelocity
    patch_file: fault_injection/autoware/FI-PLAN-008/motion_velocity_smoother_node.cpp.patch
    injection_point: "after stop-approach constraints are applied, before the velocity optimizer"
    mutation: optimizer_input_stop_constraint_deletion
    code_change:
      original: "send stop and near-stop velocity targets to the smoother"
      faulty: "replace stop and near-stop targets with 15 m/s before smoothing"
    parameters:
      stop_threshold_mps: 0.1
      replacement_velocity_mps: 15.0
    activation_condition: "optimizer input contains at least one stop or near-stop point"
    activation_oracle: "FI-PLAN-008 activated"
    expected_responsibility: ego
    responsibility_basis: "only ego Planning optimizer input differs; the scenario and output publisher are unchanged"
    expected_cctest_verdict: Aa_or_Ae
    candidate_cases:
      - vista: crossing_with_yield_signs
        ve: 5.0
        xa: 133.0
        xf: 7.9
        verified_clean_verdict: PS
        faulty_verdict: Aa
      - vista: crossing_with_yield_signs
        ve: 10.0
        xa: 120.0
        xf: 20.0
        verified_clean_verdict: PS
        faulty_verdict: Aa
    validation_notes:
      - "Two deterministic clean PS cases changed to ego-fault Aa."
      - "The mutation is upstream of the optimizer; final publication code is unchanged."
      - "All retained runs have rosbags and scene.yaml files with function- and code-level Ground Truth."
