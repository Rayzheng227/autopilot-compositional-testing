schema_version: 1
faults:
  - id: FI-CTRL-003
    status: validated_causal_ego_fault
    module: Control
    package: vehicle_cmd_gate
    source_file: control/vehicle_cmd_gate/src/vehicle_cmd_gate.cpp
    function: VehicleCmdGate::publishControlCommands
    patch_file: fault_injection/autoware/FI-CTRL-003/vehicle_cmd_gate.cpp.patch
    injection_point: "after filterControlCommand(), before control_cmd_pub_->publish()"
    mutation: post_filter_brake_polarity_inversion
    code_change:
      original: "publish negative acceleration when braking is requested"
      faulty: "replace negative acceleration with its positive magnitude and target actual_speed + 5 m/s"
    parameters:
      speed_margin_mps: 5.0
      acceleration_transform: absolute_value
    activation_condition: "engaged autonomous control, no system emergency, acceleration < 0"
    activation_oracle: "FI-CTRL-003 activated"
    expected_responsibility: ego
    responsibility_basis: "only ego Control differs from the safe clean counterfactual"
    expected_cctest_verdict: Aa_or_Ae
    candidate_cases:
      - vista: merging
        ve: 10.0
        xa: 85.0
        xf: 10.0
        verified_clean_verdict: CS
        faulty_verdict: Aa
    validation_notes:
      - "Six deterministic source-CS merging cases changed to Aa."
      - "The one-click experiment recorded rosbags with code-level Ground Truth."
